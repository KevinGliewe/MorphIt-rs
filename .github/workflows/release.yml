name: Release

# A `v*` tag builds every artifact, creates the GitHub Release and publishes
# the crates and the Python package. Started by hand it builds the artifacts
# (downloadable from the run) and publishes only when asked.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish-crates:
        description: Publish the crates to crates.io
        type: boolean
        default: false
      publish-pypi:
        description: Publish the Python package to PyPI (the tag v<version> must exist)
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          cache-key: version
      - id: v
        name: Workspace version (must match the tag)
        run: |
          version=$(bash tools/ci/version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi

  native:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        # Linux builds on the oldest supported runner: binaries need at least the
        # glibc they were linked against (2.35 on 22.04, 2.39 on 24.04), so
        # 22.04 builds also run on Ubuntu 22.04 and Debian 12 (glibc 2.36).
        include:
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          # Cross-compiled on Apple silicon: built and packaged, not run.
          - { target: x86_64-apple-darwin, os: macos-latest, cross: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          targets: ${{ matrix.target }}
          linux-deps: "true"
          cache-key: release-${{ matrix.target }}
      - name: Build
        shell: bash
        run: >
          cargo build --release --locked --target ${{ matrix.target }}
          -p morphit-cli -p morphit-studio -p morphit-server -p morphit-capi
      - name: Package
        shell: bash
        run: bash tools/ci/package.sh ${{ matrix.target }} ${{ needs.version.outputs.version }} dist
      - name: C package works with CMake (shared and static)
        if: ${{ !matrix.cross }}
        shell: bash
        # The archive (.zip or .tar.gz), not its .sha256.
        run: bash tools/ci/test_capi_package.sh dist/morphit-capi-*-${{ matrix.target }}.*[a-z]
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Python wheels (abi3: one per platform for Python 3.9+), built by maturin;
  # Linux in the manylinux_2_28 container (glibc 2.28+).
  wheels:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, manylinux: "2_28" }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, manylinux: "2_28" }
          - { target: aarch64-apple-darwin, os: macos-latest }
          # Cross-compiled on Apple silicon: built, not installed.
          - { target: x86_64-apple-darwin, os: macos-latest, cross: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --locked --out dist -m crates/morphit-py/Cargo.toml
      - name: The wheel installs and packs a mesh
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          python -m pip install dist/*.whl
          python -c "import morphit_rs as mi; r = mi.pack(mi.Mesh.load('crates/morphit/tests/fixtures/link0.obj'), mi.Config.preset(num_spheres=8, iterations=20, seed=0)); print(mi.__version__, r)"
      - name: Checksums
        shell: bash
        run: cd dist && for f in *.whl; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  sdist:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m crates/morphit-py/Cargo.toml
      - name: Checksum
        run: cd dist && for f in *.tar.gz; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*
          if-no-files-found: error

  web:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          wasm-tools: "true"
          cache-key: web
      - name: Build the studio and the wasm package
        run: bash tools/build_pages.sh
      - name: Package
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          (cd target && rm -rf "morphit-studio-web-$V" && cp -r studio-dist "morphit-studio-web-$V" \
            && zip -qr "../dist/morphit-studio-web-$V.zip" "morphit-studio-web-$V")
          pkg="target/morphit-wasm-$V"
          rm -rf "$pkg" && cp -r target/pages/wasm/pkg "$pkg"
          cp README.md LICENSE "$pkg/"
          tar -C target -czf "dist/morphit-wasm-$V.tar.gz" "morphit-wasm-$V"
          cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/*
          if-no-files-found: error

  github-release:
    if: github.ref_type == 'tag' && !github.event.act
    needs: [ci, native, web, wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # A rerun (or a release made by hand) only replaces the files.
      - name: Create the release or update its files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "MorphIt $GITHUB_REF_NAME" --generate-notes --verify-tag
          fi

  crates:
    if: github.ref_type == 'tag' || inputs.publish-crates
    needs: [ci, native]
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          cache-key: package
      - name: Publish (dry run under act)
        if: env.ACT
        run: bash tools/ci/publish_crates.sh --dry-run
      - name: Publish
        if: ${{ !env.ACT }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash tools/ci/publish_crates.sh

  # PyPI Trusted Publishing: no token. One-time setup on pypi.org: a (pending)
  # trusted publisher for project morphit-rs, this repository, workflow
  # release.yml, environment pypi.
  pypi:
    if: (github.ref_type == 'tag' || inputs.publish-pypi) && !github.event.act
    needs: [ci, version, wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: The release tag exists
        run: |
          git ls-remote --exit-code --tags origin "refs/tags/v${{ needs.version.outputs.version }}" >/dev/null             || { echo "::error::tag v${{ needs.version.outputs.version }} is not on origin; push it first"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: dist
          name: sdist
      - name: Only the packages
        run: rm -f dist/*.sha256 && ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          cache-key: fmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          linux-deps: "true"
          cache-key: clippy
      - name: Clippy (native, whole workspace)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy (wasm32)
        run: cargo clippy -p morphit-wasm -p morphit-studio --target wasm32-unknown-unknown --locked -- -D warnings
      - name: C header is up to date
        run: git diff --exit-code crates/morphit-capi/include

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          linux-deps: ${{ matrix.os == 'ubuntu-latest' }}
          cache-key: test-${{ matrix.os }}
      - name: Tests (every native crate except the studio)
        run: cargo t --locked
      - name: Tests without rayon (sequential loops, same results)
        if: runner.os == 'Linux'
        run: |
          cargo test -p morphit --no-default-features --features gpu,union --locked
          cargo test -p morphit-robot --no-default-features --features gpu,union,zip --locked
      - name: MorphIt Studio library tests
        if: runner.os == 'Linux'
        run: cargo test -p morphit-studio --lib --locked

  # The GPU backend on lavapipe (Mesa's software Vulkan): the CPU = GPU
  # bit-identity tests run instead of skipping for want of an adapter.
  test-gpu:
    runs-on: ubuntu-latest
    env:
      MORPHIT_GPU_ALLOW_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          cache-key: test-gpu
      - name: Mesa lavapipe
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends mesa-vulkan-drivers libvulkan1
      - name: An adapter is visible
        run: |
          cargo run -q -p morphit-cli --locked -- devices | tee devices.txt
          if grep -q "no GPU adapters" devices.txt; then
            echo "::error::lavapipe was not found by wgpu"
            exit 1
          fi
      - name: GPU tests
        run: |
          cargo test -p morphit --lib --locked search::gpu
          cargo test -p morphit-capi --test threading --locked
          cargo test -p morphit-cli --test cli --locked gpu

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          wasm-tools: "true"
          cache-key: wasm
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Library builds for wasm32
        run: |
          cargo build -p morphit --target wasm32-unknown-unknown --no-default-features --features union --locked
          cargo build -p morphit --target wasm32-unknown-unknown --no-default-features --features gpu,union --locked
          cargo build -p morphit-robot --target wasm32-unknown-unknown --no-default-features --features gpu,union,zip --locked
      - name: JavaScript API in Node
        run: cargo test -p morphit-wasm --target wasm32-unknown-unknown --test node --locked
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          install-chromedriver: true
          install-dependencies: true
      - name: JavaScript API in headless Chrome
        env:
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          # The runner image has its own Chrome; drive the one matching this
          # chromedriver (wasm-bindgen-test-runner reads webdriver.json from
          # the working directory, the crate's folder under cargo test).
          printf '{ "goog:chromeOptions": { "binary": "%s" } }\n' "$CHROME" \
            | tee webdriver.json crates/morphit-wasm/webdriver.json
          cargo test -p morphit-wasm --target wasm32-unknown-unknown --test browser --locked
      - name: npm package (morphit-rs) in Node, TypeScript types
        run: |
          bash tools/build_npm.sh
          node tools/ci/test_npm_package.mjs

  # The C++ wrapper (morphit.hpp) and the C examples, built with CMake against
  # the release build of the C library; the wrapper's test program runs.
  cpp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          cache-key: cpp-${{ matrix.os }}
      - run: cargo build --release --locked -p morphit-capi
      - name: Build the C and C++ examples
        run: |
          cmake -S crates/morphit-capi/examples/c -B build/examples -DCMAKE_BUILD_TYPE=Release
          cmake --build build/examples --config Release
      - name: C++ wrapper tests and examples
        shell: bash
        run: |
          run() { prog=$(find build/examples -type f \( -name "$1" -o -name "$1.exe" \) | head -n 1); shift; "$prog" "$@"; }
          run test_morphit "$PWD"
          run pack_cpp crates/morphit/tests/fixtures/link0.obj MorphIt-B 8 20 1 build/out.json
          run robot_cpp web/examples/kinova_description 4 10 build/robot.urdf
          grep -q "<sphere" build/robot.urdf

  # The C# library (bindings/dotnet) over the release build of the C library.
  dotnet:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          cache-key: dotnet-${{ matrix.os }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - run: cargo build --release --locked -p morphit-capi
      - run: dotnet test bindings/dotnet/MorphIt.Tests -c Release

  # The Python package (crates/morphit-py): build the wheel, install it, run
  # the pytest suite against the installed package, and check the type stubs.
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          cache-key: python-${{ matrix.os }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and install the wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --locked -m crates/morphit-py/Cargo.toml --out dist
          python -m pip install dist/*.whl pytest mypy
      - name: pytest
        # Run from outside the source folder so the installed package is tested.
        working-directory: crates/morphit-py/tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Type stubs match the extension, package type-checks
        if: runner.os == 'Linux'
        run: |
          python -m mypy.stubtest morphit_rs._native
          python -m mypy --strict crates/morphit-py/python/morphit_rs

  # Packages and verifies every publishable crate as crates.io would build it.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          cache-key: package
      - run: bash tools/ci/publish_crates.sh --dry-run

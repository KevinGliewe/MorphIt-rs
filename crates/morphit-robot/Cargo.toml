[package]
name = "morphit-robot"
description = "URDF generation, robot-package inspection, per-link packing and quality metrics for MorphIt"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = ["gpu", "union", "parallel"]
parallel = ["morphit/parallel"]
# Robot packages from .zip archives (MemPackage::from_zip).
zip = ["dep:zip"]
gpu = ["morphit/gpu"]
union = ["morphit/union"]

[dependencies]
morphit = { workspace = true, default-features = false }
rand.workspace = true
roxmltree.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
web-time.workspace = true
zip = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

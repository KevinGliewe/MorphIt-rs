[package]
name = "morphit-capi"
description = "Thread-safe C API for the MorphIt sphere-packing optimizer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[lib]
name = "morphit_capi"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["gpu", "union", "parallel"]
parallel = ["morphit/parallel"]
gpu = ["morphit/gpu"]
union = ["morphit/union"]
# Exposes morphit__panic_for_test() so tests can exercise the panic guard.
test-hooks = []

[dependencies]
morphit = { workspace = true, default-features = false }
rayon.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
cbindgen.workspace = true

[dev-dependencies]
tempfile.workspace = true

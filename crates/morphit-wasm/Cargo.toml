[package]
name = "morphit-wasm"
description = "WebAssembly bindings of the MorphIt sphere-packing optimizer (JavaScript/TypeScript API)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["gpu", "union"]
# WebGPU compute in the browser (results stay bit-identical to the CPU).
gpu = ["morphit/gpu", "morphit-robot/gpu"]
union = ["morphit/union", "morphit-robot/union"]

[dependencies]
morphit = { workspace = true, default-features = false }
morphit-robot = { workspace = true, default-features = false, features = ["zip"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
web-time.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
serde-wasm-bindgen.workspace = true
console_error_panic_hook.workspace = true
tracing-wasm.workspace = true

[dev-dependencies]
wasm-bindgen-test.workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals"]

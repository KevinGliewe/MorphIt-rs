[package]
name = "morphit-server"
description = "HTTP API for MorphIt, wire-compatible with the Python reference's web service"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "morphit-server"
path = "src/main.rs"
doc = false

[features]
default = ["gpu", "union", "parallel"]
parallel = ["morphit/parallel", "morphit-robot/parallel"]
gpu = ["morphit/gpu", "morphit-robot/gpu"]
union = ["morphit/union", "morphit-robot/union"]

[dependencies]
morphit = { workspace = true, default-features = false }
morphit-robot = { workspace = true, default-features = false }
axum.workspace = true
clap.workspace = true
mime_guess.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
futures-util.workspace = true
reqwest.workspace = true
tempfile.workspace = true
tokio-tungstenite.workspace = true
